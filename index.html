<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Estoque de Peças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho, faixa de resumo, chips de caixa, lista em grade (vira cartão no celular). */
:root{
  --bg:#F2F0F0; --surface:#FFFFFF; --ink:#151516; --muted:#68686E; --line:#DDDADA;
  --accent:#D3111F; --accent-ink:#FFFFFF; --accent-soft:#FBE4E6;
  --good:#1D7A4B; --warn:#A8610A; --bad:#8E1B14; --row-hover:#F8F5F5;
  --band:#0C0C0D; --band-ink:#FFFFFF; --band-muted:#B4B4BA; --band-line:#3A3A3E;
  --f-display:'Sora','Manrope',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0A0B; --surface:#151516; --ink:#F1F1F2; --muted:#9C9CA3; --line:#2B2B2E;
  --accent:#F23A47; --accent-ink:#FFFFFF; --accent-soft:#3A1519;
  --good:#5CC48A; --warn:#E0A44B; --bad:#FF8A82; --row-hover:#1C1C1E;
  --band:#000000; --band-ink:#FFFFFF; --band-muted:#A5A5AB; --band-line:#333337; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0B; --surface:#151516; --ink:#F1F1F2; --muted:#9C9CA3; --line:#2B2B2E;
  --accent:#F23A47; --accent-ink:#FFFFFF; --accent-soft:#3A1519;
  --good:#5CC48A; --warn:#E0A44B; --bad:#FF8A82; --row-hover:#1C1C1E;
  --band:#000000; --band-ink:#FFFFFF; --band-muted:#A5A5AB; --band-line:#333337; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);padding-inline:16px;padding-block:20px 48px}
.app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--band);color:var(--band-ink);border-radius:10px;border-bottom:4px solid var(--accent);padding:18px 20px}
header .sub{color:var(--band-muted)}
header .btn:not(.primary){background:transparent;border-color:var(--band-line);color:var(--band-ink)}
header .btn:not(.primary):hover{border-color:var(--accent)}
h1{font:700 28px/1.1 var(--f-display);letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.sum{display:flex;flex-wrap:wrap;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.sum>div{flex:1 1 150px;padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.sum>div:last-child{border-right:0}
.sum b{display:block;font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.sum span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab{font-family:var(--f-display);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search],.tools select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;min-width:0}
.tools input[type=search]{flex:1 1 220px}
.tools select{flex:0 1 190px}
.chk{display:flex;gap:6px;align-items:center;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip i{font:500 12px var(--f-mono);font-style:normal;opacity:.75;margin-left:5px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.r{display:grid;grid-template-columns:104px minmax(0,2.3fr) minmax(0,1fr) minmax(0,1.2fr) 52px 168px;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.r:first-child{border-top:0}
.r.h{background:var(--bg);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-block:7px}
.r.h button{background:none;border:0;padding:0;cursor:pointer;text-transform:inherit;letter-spacing:inherit;color:inherit;font-weight:600;text-align:left}
.r.h button[aria-sort]{color:var(--ink)}
.r:not(.h):hover{background:var(--row-hover)}
.tag{display:inline-block;font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);border-radius:3px;padding:2px 6px;white-space:nowrap;background:var(--bg)}
.peca{font-weight:500;min-width:0;overflow-wrap:anywhere}
.obs{display:block;color:var(--warn);font-size:12px;font-weight:400}
.c{min-width:0;overflow-wrap:anywhere;color:var(--muted)}
.q{font:600 17px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.r.zero .peca,.r.zero .c{opacity:.55}.r.zero .q{color:var(--warn)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 20px var(--f-display);margin-bottom:4px}
.pill{font:500 12px var(--f-mono);padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.venda,.pill.retorno{color:var(--good)}.pill.entrada{color:var(--accent)}.pill.saida,.pill.exclusao{color:var(--bad)}.pill.ajuste,.pill.retirada{color:var(--warn)}
.hist{display:grid;grid-template-columns:128px 92px minmax(0,2fr) 100px 56px 96px minmax(0,1.2fr);gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.hist.h{background:var(--bg);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0;padding-block:7px}
.rt{display:grid;grid-template-columns:92px 84px minmax(0,2fr) minmax(0,1.1fr) 108px 44px 104px;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.rt.h{background:var(--bg);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0;padding-block:7px}
.rt.zero{opacity:.55}.rt .obs{color:var(--muted)}.rt .os{font:600 14px var(--f-mono)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:0}
.ov{position:fixed;inset:0;background:rgba(8,14,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;z-index:10}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:100%;max-width:480px;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h2{font:700 22px var(--f-display);letter-spacing:-.01em;margin:0}
.modal p{margin:0;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.mact{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.mact div{display:flex;gap:8px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:20;max-width:90vw}
@media (max-width:760px){
  .r.h,.hist.h{display:none}
  .r{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"tag q" "peca peca" "meta acts";gap:6px 12px;padding:12px 14px}
  .r>.tagc{grid-area:tag}.r>.peca{grid-area:peca}.r>.q{grid-area:q}.r>.acts{grid-area:acts}
  .r>.cf,.r>.cm{display:none}.r>.meta{grid-area:meta;display:block}
  .hist{grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px}
  .hist>.hd{grid-column:1/-1}
  .rt.h{display:none}
  .rt{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"os q" "peca peca" "meta acts";gap:6px 12px;padding:12px 14px}
  .rt>.os{grid-area:os}.rt>.peca{grid-area:peca}.rt>.q{grid-area:q}.rt>.acts{grid-area:acts}.rt>.meta{grid-area:meta;display:block}
  .rt>.rd,.rt>.rw,.rt>.rc{display:none}
}
@media (min-width:761px){.r>.meta,.rt>.meta{display:none}}
.sum>div{border-bottom:0}
@media (max-width:520px){.sum>div{flex-basis:45%;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s}}
</style>
</head><body>

<div class="app">
  <header>
    <div>
      <h1>Estoque de Peças</h1>
      <div class="sub" id="status">Conectando ao armazenamento…</div>
    </div>
    <div class="hbtns">
      <button class="btn" id="bExport" type="button">Exportar CSV</button>
      <button class="btn" id="bOut" type="button" hidden>Sair</button>
      <button class="btn primary" id="bNew" type="button">+ Nova peça</button>
    </div>
  </header>

  <section class="sum" id="sum" aria-label="Resumo"></section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="estoque" aria-selected="true">Peças</button>
    <button class="tab" role="tab" data-tab="ret" aria-selected="false">Peças retiradas</button>
    <button class="tab" role="tab" data-tab="hist" aria-selected="false">Histórico</button>
  </div>

  <div id="pEstoque" style="display:flex;flex-direction:column;gap:12px">
    <div class="tools">
      <input type="search" id="q" placeholder="Buscar peça, modelo, fabricante ou observação" aria-label="Buscar">
      <select id="fab" aria-label="Fabricante"></select>
      <label class="chk"><input type="checkbox" id="hz"> Ocultar zeradas</label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
    <p class="note" id="count"></p>
  </div>

  <div id="pRet" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="tools">
      <input type="search" id="rq" placeholder="Buscar por OS, quem retirou, peça ou caixa" aria-label="Buscar retiradas">
      <label class="chk"><input type="checkbox" id="rs"> Mostrar revertidas</label>
      <button class="btn" id="bHist" type="button">+ Registro antigo</button>
    </div>
    <div class="list" id="retList"></div>
    <p class="note" id="retCount"></p>
  </div>

  <div id="pHist" hidden>
    <div class="list" id="histList"></div>
  </div>
</div>

<div class="ov" id="ov" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="ov" id="login" hidden>
  <form class="modal" id="loginForm" autocomplete="on">
    <h2>Entrar</h2>
    <p id="loginMsg">Use o e-mail e a senha cadastrados para acessar o estoque.</p>
    <div class="fld"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="fld"><label for="lPass">Senha</label><input id="lPass" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lErr"></div>
    <div class="mact"><span></span><button class="btn primary" id="lOk" type="submit">Entrar</button></div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const clone=o=>JSON.parse(JSON.stringify(o));
const TIPOS={retirada:'Retirada',retorno:'Retorno',entrada:'Entrada',ajuste:'Ajuste',exclusao:'Exclusão',venda:'Venda',saida:'Saída'};
const NEG={retirada:1,exclusao:1,venda:1,saida:1};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString('en-CA');
const fdate=s=>{const p=String(s||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:''};

let db=null,dl=null,canWrite=true,caixas={},movs={};
const ui={tab:'estoque',q:'',caixa:'',fab:'',hz:false,sort:'caixa',dir:1,rq:'',rShow:false,armed:'',caixasOk:false,movsOk:false,err:''};

/* ---------- gravação ---------- */
const queues={};
function enqueue(path,fn){const p=(queues[path]||Promise.resolve()).catch(()=>{}).then(fn);queues[path]=p;return p}
function putCaixa(cid,nome,items){return enqueue('caixas/'+cid,()=>db.doc('caixas/'+cid).set({nome,items}))}
function addMov(m){
  const t=m.t||new Date().toISOString(),ym=t.slice(0,7);
  const entries=(movs[ym]||[]).concat([Object.assign({},m,{t,mid:newId()})]);
  return enqueue('movs/'+ym,()=>db.doc('movs/'+ym).set({entries}));
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400)}

/* ---------- dados derivados ---------- */
function rows(){
  const out=[];
  Object.keys(caixas).sort().forEach(cid=>{(caixas[cid].items||[]).forEach(it=>out.push(Object.assign({},it,{cid,caixa:caixas[cid].nome})))});
  return out;
}
function filtered(){
  const q=norm(ui.q).split(/\s+/).filter(Boolean);
  let r=rows().filter(x=>{
    if(ui.caixa&&x.cid!==ui.caixa)return false;
    if(ui.fab&&x.fab!==ui.fab)return false;
    if(ui.hz&&!(x.qtd>0))return false;
    if(q.length){const hay=norm([x.peca,x.fab,x.modelo,x.obs,x.caixa].join(' '));if(!q.every(t=>hay.includes(t)))return false}
    return true;
  });
  const k=ui.sort;
  if(k!=='caixa'){
    r=r.map((x,i)=>[x,i]).sort((a,b)=>{
      const A=a[0][k],B=b[0][k];
      const c=k==='qtd'?(A-B):String(A||'').localeCompare(String(B||''),'pt-BR',{numeric:true});
      return (c||a[1]-b[1])*ui.dir;
    }).map(x=>x[0]);
  } else if(ui.dir<0) r.reverse();
  return r;
}
function findItem(cid,id){const c=caixas[cid];return c?(c.items||[]).find(i=>i.id===id):null}

/* ---------- render ---------- */
function render(){
  const ready=ui.caixasOk;
  const all=rows();
  const total=all.reduce((s,x)=>s+(+x.qtd||0),0);
  const tipos=all.filter(x=>x.qtd>0).length;
  let retQ=0,retM=0;const ymNow=today().slice(0,7);
  Object.values(movs).forEach(a=>a.forEach(m=>{if(m.tipo==='retirada'&&!m.revertida){retQ+=m.qtd;if(String(m.dataRet||'').slice(0,7)===ymNow)retM+=m.qtd}}));
  $('#sum').innerHTML=
    `<div><b>${total}</b><span>peças em estoque</span></div>`+
    `<div><b>${tipos}</b><span>linhas com saldo</span></div>`+
    `<div><b>${Object.keys(caixas).length}</b><span>caixas</span></div>`+
    `<div><b>${retQ}</b><span>peças retiradas p/ OS</span></div>`+
    `<div><b>${retM}</b><span>retiradas neste mês</span></div>`;
  $('#status').textContent=ui.err?ui.err:!ready?'Carregando estoque…':(canWrite?'Tudo é salvo automaticamente.':'Somente leitura: você não tem permissão para alterar.');
  $('#bNew').disabled=!canWrite||!ready;
  $('#bHist').disabled=!canWrite||!ui.movsOk;

  // fabricantes
  const fabs=[...new Set(all.map(x=>x.fab).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const sel=$('#fab');const want='<option value="">Todos os fabricantes</option>'+fabs.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('');
  if(sel.dataset.sig!==want){sel.innerHTML=want;sel.dataset.sig=want}
  sel.value=ui.fab;

  // chips de caixa
  const cnt={};all.forEach(x=>cnt[x.cid]=(cnt[x.cid]||0)+(+x.qtd||0));
  $('#chips').innerHTML=`<button class="chip" data-c="" aria-pressed="${!ui.caixa}">Todas<i>${total}</i></button>`+
    Object.keys(caixas).sort().map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${ui.caixa===c}">${esc(caixas[c].nome)}<i>${cnt[c]||0}</i></button>`).join('');

  renderList();renderRet();renderHist();
}
function renderList(){
  const L=$('#list');
  if(!ui.caixasOk){
    L.innerHTML=ui.err?'<div class="empty"><b>Falha ao carregar</b>Não foi possível carregar o estoque. Verifique a conexão e atualize a página.</div>':'<div class="empty"><b>Carregando</b>Buscando suas peças…</div>';
    $('#count').textContent='';return}
  const r=filtered();
  const th=(k,t)=>`<button type="button" data-s="${k}" ${ui.sort===k?`aria-sort="${ui.dir>0?'ascending':'descending'}"`:''}>${t}${ui.sort===k?(ui.dir>0?' ↑':' ↓'):''}</button>`;
  let h=`<div class="r h"><div>${th('caixa','Caixa')}</div><div>${th('peca','Peça')}</div><div>${th('fab','Fabricante')}</div><div>${th('modelo','Modelo')}</div><div style="text-align:right">${th('qtd','Qtd')}</div><div></div></div>`;
  if(!r.length){
    h+=Object.keys(caixas).length?'<div class="empty"><b>Nada encontrado</b>Mude a busca ou limpe os filtros.</div>':'<div class="empty"><b>Estoque vazio</b>Use “+ Nova peça” para cadastrar a primeira.</div>';
  }
  h+=r.map(x=>`<div class="r ${x.qtd>0?'':'zero'}">
    <div class="tagc"><span class="tag">${esc(x.caixa)}</span></div>
    <div class="peca">${esc(x.peca)}${x.obs?`<span class="obs">${esc(x.obs)}</span>`:''}</div>
    <div class="c cf">${esc(x.fab)}</div><div class="c cm">${esc(x.modelo)}</div>
    <div class="c meta">${esc([x.fab,x.modelo].filter(Boolean).join(' · '))}</div>
    <div class="q">${x.qtd}</div>
    <div class="acts"><button class="btn sm" data-a="mov" data-c="${esc(x.cid)}" data-i="${esc(x.id)}" ${canWrite?'':'disabled'}>Retirar</button><button class="btn sm" data-a="edit" data-c="${esc(x.cid)}" data-i="${esc(x.id)}" ${canWrite?'':'disabled'}>Editar</button></div>
  </div>`).join('');
  L.innerHTML=h;
  const sum=r.reduce((s,x)=>s+(+x.qtd||0),0);
  $('#count').textContent=`${r.length} linhas · ${sum} peças`+(r.length!==rows().length?' (filtrado)':'');
}
function renderHist(){
  const L=$('#histList');
  const all=[];Object.keys(movs).forEach(k=>movs[k].forEach(m=>all.push(m)));
  all.sort((a,b)=>b.t.localeCompare(a.t));
  if(!all.length){L.innerHTML='<div class="empty"><b>Sem movimentações</b>Vendas, saídas, entradas e ajustes aparecem aqui.</div>';return}
  let h='<div class="hist h"><div>Data</div><div>Tipo</div><div>Peça</div><div>Caixa</div><div style="text-align:right">Qtd</div><div>OS</div><div>Quem / obs.</div></div>';
  h+=all.slice(0,500).map(m=>{
    const sg=NEG[m.tipo]?'−':'+';
    const q=m.tipo==='ajuste'?(m.qtd>0?'+':'')+m.qtd:sg+m.qtd;
    return `<div class="hist"><div class="mono">${m.historico?esc(fdate(m.dataRet)):esc(new Date(m.t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}))}</div>

function retiradas(){
  const out=[];
  Object.keys(movs).forEach(ym=>movs[ym].forEach(m=>{if(m.tipo==='retirada')out.push(Object.assign({},m,{ym}))}));
  out.sort((a,b)=>(b.dataRet||'').localeCompare(a.dataRet||'')||b.t.localeCompare(a.t));
  return out;
}
function retFiltered(){
  const q=norm(ui.rq).split(/\s+/).filter(Boolean);
  return retiradas().filter(m=>(ui.rShow||!m.revertida)&&(!q.length||q.every(t=>norm([m.os,m.veiculo,m.quem,m.peca,m.fab,m.modelo,m.caixa,m.nota].join(' ')).includes(t))));
}

async function revertRetirada(m){
  // acha a peça onde ela está hoje (pode ter mudado de caixa depois da retirada)
  let cid=Object.keys(caixas).find(c=>(caixas[c].items||[]).some(i=>i.id===m.itemId))||m.cid;
  const cx=caixas[cid];if(!cx)throw new Error('caixa');
  const items=clone(cx.items||[]);
  const ix=items.findIndex(i=>i.id===m.itemId);
  if(ix>=0)items[ix].qtd+=m.qtd;
  else items.push({id:m.itemId,peca:m.peca,fab:m.fab,modelo:m.modelo,qtd:m.qtd,obs:''});
  await putCaixa(cid,cx.nome,items);
  const t=new Date().toISOString(),cur=t.slice(0,7);
  const fields={tipo:'retorno',cid,itemId:m.itemId,peca:m.peca,fab:m.fab,modelo:m.modelo,caixa:cx.nome,qtd:m.qtd,os:m.os,quem:m.quem,nota:'Retirada revertida',ref:m.mid};
  const flag=e=>e.mid===m.mid?Object.assign({},e,{revertida:true,revertidaEm:t}):e;
  if(m.ym===cur){
    const entries=(movs[cur]||[]).map(flag).concat([Object.assign({t,mid:newId()},fields)]);
    await enqueue('movs/'+cur,()=>db.doc('movs/'+cur).set({entries}));
  } else {
    await enqueue('movs/'+m.ym,()=>db.doc('movs/'+m.ym).set({entries:(movs[m.ym]||[]).map(flag)}));
    await addMov(fields);
  }
}

  return {
    doc(path){return {
      async set(data){const r=await sb.from(TBL).upsert({path,data,updated_at:new Date().toISOString()});if(r.error)throw r.error}
    }},
    collection(name){return {
      onSnapshot(next,err){
        let alive=true;
        const load=async()=>{
          const r=await sb.from(TBL).select('path,data').like('path',name+'/%');
          if(!alive)return;
          if(r.error){if(err)err(r.error);return}
          next({docs:r.data.map(x=>({id:x.path.slice(name.length+1),data:()=>x.data}))});
        };
        load();
        const ch=sb.channel('rt-'+name).on('postgres_changes',{event:'*',schema:'public',table:TBL},()=>load()).subscribe();
        const poll=setInterval(load,30000);
        return ()=>{alive=false;clearInterval(poll);sb.removeChannel(ch)};
      }
    }}
  };
}
function startApp(){
  $('#login').hidden=true;$('#bOut').hidden=false;
  db=makeDb();canWrite=true;render();
  db.collection('caixas').onSnapshot(s=>{caixas={};s.docs.forEach(d=>{caixas[d.id]=d.data()});ui.caixasOk=true;render()},e=>{ui.err='Falha ao carregar o estoque.';render()});
  db.collection('movs').onSnapshot(s=>{movs={};s.docs.forEach(d=>{movs[d.id]=(d.data().entries||[])});ui.movsOk=true;render()},e=>{});
}
function showLogin(msg){
  $('#login').hidden=false;
  if(msg)$('#loginMsg').textContent=msg;
}
$('#bOut').onclick=async()=>{try{await sb.auth.signOut()}catch(e){}location.reload()};
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();$('#lErr').textContent='';$('#lOk').disabled=true;
  try{
    const r=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lPass').value});
    if(r.error)throw r.error;
    startApp();
  }catch(x){$('#lErr').textContent='E-mail ou senha incorretos.'}
  $('#lOk').disabled=false;
};
(async()=>{
  render();
  if(!window.supabase||CFG.url.indexOf('__')===0){showLogin('Site ainda não configurado: faltam a URL e a chave do banco de dados.');$('#lOk').disabled=true;return}
  try{
    sb=window.supabase.createClient(CFG.url,CFG.key);
    const r=await sb.auth.getSession();
    if(r.data&&r.data.session)startApp();else showLogin();
  }catch(e){showLogin('Não foi possível conectar ao banco de dados.')}
})();
</script>
